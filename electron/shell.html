<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>ACEswarm</title><link rel="stylesheet" href="./shell.css" /></head>
<body>
  <main id="shell" class="shell">
    <header class="desktop-bar">
      <div class="brand"><img src="./assets/aivuda_icon.png" alt="" /><strong>ACEswarm</strong><span>Workspace</span></div>
      <span id="window-count">Desktop</span>
      <div class="desktop-actions">
        <button id="show-desktop" class="icon-button" title="Show desktop" aria-label="Show desktop"><i data-lucide="panels-top-left"></i></button>
        <button id="new-tab" class="icon-button" title="Open page" aria-label="Open page"><i data-lucide="plus"></i></button>
        <div class="tools-menu-wrap">
          <button id="tools-button" class="icon-button" title="Tools" aria-label="Tools" aria-haspopup="true" aria-expanded="false"><i data-lucide="settings-2"></i></button>
          <div id="tools-menu" class="tools-menu" role="menu" hidden>
            <button id="tools-fps" role="menuitem">FPS / GPU Overlay</button>
            <button id="tools-record" role="menuitem">Screen Record</button>
            <button id="tools-clear-data" role="menuitem">Clear Browser Data</button>
          </div>
        </div>
        <time id="desktop-clock"></time>
      </div>
    </header>
    <section id="desktop-shortcuts" class="desktop-shortcuts" aria-label="Desktop applications"></section>
    <section id="webview-stack" class="window-layer" aria-label="Application windows"></section>
    <nav id="dock" class="dock" aria-label="Application Dock"></nav>
    <div id="dock-menu" class="dock-menu" role="menu" hidden></div>
  </main>
  <div id="browser-toolbar" class="browser-toolbar" hidden>
    <button id="back-button" class="icon-button" title="Back" aria-label="Back"><i data-lucide="arrow-left"></i></button>
    <button id="forward-button" class="icon-button" title="Forward" aria-label="Forward"><i data-lucide="arrow-right"></i></button>
    <button id="reload-button" class="icon-button" title="Reload" aria-label="Reload"><i data-lucide="rotate-cw"></i></button>
    <input id="address-input" type="url" aria-label="Page address" spellcheck="false" />
    <button id="add-favorite" class="icon-button" title="Pin to Dock" aria-label="Pin to Dock"><i data-lucide="pin"></i></button>
    <span id="status-text">Ready</span>
    <button id="collapse-chrome" class="icon-button" title="Hide address bar" aria-label="Hide address bar"><i data-lucide="chevron-up"></i></button>
  </div>
  <dialog id="open-page-dialog">
    <form id="open-page-form">
      <div class="dialog-heading"><h2>Open page</h2><button id="close-page-dialog" class="icon-button" type="button" title="Close" aria-label="Close"><i data-lucide="x"></i></button></div>
      <label for="open-page-url">Address</label>
      <input id="open-page-url" type="text" placeholder="https:// or robot address" required autocomplete="off" />
      <p id="open-page-error" role="alert" hidden></p>
      <div class="dialog-actions"><button id="open-home" type="button">Home</button><button id="open-store" type="button">AppStore</button><button class="primary" type="submit">Open</button></div>
    </form>
  </dialog>
  <script src="../node_modules/winbox/dist/winbox.bundle.min.js"></script>
  <script src="../node_modules/lucide/dist/umd/lucide.min.js"></script>
  <script src="./desktop-state.js"></script>
  <script src="./desktop.js"></script>
  <script src="./shell.js"></script>
</body>
</html>
