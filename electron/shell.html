<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>ACEswarm</title><link rel="stylesheet" href="./shell.css" /></head>
<body>
  <main id="shell" class="shell dock-collapsed">
    <header class="desktop-bar">
        <div class="tools-menu-wrap">
          <button id="tools-button" class="system-button" title="ACEswarm System" aria-label="System" aria-haspopup="menu" aria-expanded="false"><img src="./assets/aivuda_icon.png" alt="" /><span>System</span><i data-lucide="chevron-down"></i></button>
          <div id="tools-menu" class="tools-menu" role="menu" aria-label="System" hidden>
            <button id="system-open-page" role="menuitem"><i data-lucide="plus"></i>Open page</button>
            <button id="system-desktop" role="menuitem"><i data-lucide="panels-top-left"></i>Show desktop</button>
            <hr />
            <label class="appearance-setting"><span>Theme</span><select id="system-theme" aria-label="Theme"><option value="system">Follow System</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
            <label class="appearance-setting"><span>Language</span><select id="system-language" aria-label="Language"><option value="system">Follow System</option><option value="en-US">English</option><option value="zh-CN">简体中文</option></select></label>
            <hr />
            <button id="tools-fps" role="menuitemcheckbox" aria-checked="false"><i data-lucide="activity"></i>FPS / GPU Overlay</button>
            <button id="tools-record" role="menuitemcheckbox" aria-checked="false"><i data-lucide="video"></i>Screen Record</button>
            <button id="system-fullscreen" role="menuitem"><i data-lucide="expand"></i>Fullscreen</button>
            <button id="tools-clear-data" role="menuitem"><i data-lucide="eraser"></i>Clear Browser Data</button>
            <hr />
            <button id="system-quit" role="menuitem"><i data-lucide="power"></i>Quit ACEswarm</button>
          </div>
        </div>
      <div class="tools-menu-wrap applications-wrap">
        <button id="applications-button" class="system-button" aria-haspopup="menu" aria-expanded="false"><i data-lucide="layout-grid"></i><span>Applications</span><i data-lucide="chevron-down"></i></button>
        <div id="applications-menu" class="tools-menu" role="menu" aria-label="Applications" hidden></div>
      </div>
      <nav id="dock" class="dock" aria-label="Window taskbar"></nav>
      <span id="window-count">Desktop</span>
      <div class="desktop-actions">
        <div id="background-apps" aria-label="Running applications" hidden>
          <button id="background-apps-toggle" class="icon-button" title="More running applications" aria-label="More running applications" aria-expanded="false" aria-controls="background-apps-overflow" hidden><i data-lucide="chevron-up"></i></button>
          <div id="background-apps-visible"></div>
          <div id="background-apps-overflow" role="group" aria-label="More running applications" hidden></div>
        </div>
        <button id="show-desktop" class="icon-button" title="Show desktop" aria-label="Show desktop"><i data-lucide="panels-top-left"></i></button>
        <button id="new-tab" class="icon-button" title="Open page" aria-label="Open page"><i data-lucide="plus"></i></button>
        <time id="desktop-clock"></time>
      </div>
    </header>
    <section id="desktop-shortcuts" class="desktop-shortcuts" aria-label="Desktop applications"></section>
    <dialog id="application-launcher" aria-labelledby="launcher-title">
      <div class="dialog-heading"><h2 id="launcher-title">Applications</h2><button id="close-application-launcher" class="icon-button" title="Close" aria-label="Close applications"><i data-lucide="x"></i></button></div>
      <input id="launcher-search" type="search" placeholder="Search applications" aria-label="Search all applications" />
      <div id="launcher-grid"></div>
      <p id="launcher-status" role="status" hidden></p>
    </dialog>
    <section id="webview-stack" class="window-layer" aria-label="Application windows"></section>
    <div id="dock-menu" class="dock-menu" role="menu" hidden></div>
    <div id="background-app-menu" class="dock-menu" role="menu" aria-label="Application actions" hidden></div>
    <div id="window-menu" class="window-menu" role="menu" aria-label="Window controls" hidden>
      <div class="workspace-layout" role="group" aria-label="Window layout">
        <button id="workspace-left" class="icon-button" title="Left half" aria-label="Left half"><i data-lucide="panel-left"></i></button>
        <button id="workspace-right" class="icon-button" title="Right half" aria-label="Right half"><i data-lucide="panel-right"></i></button>
        <button id="workspace-top" class="icon-button" title="Top half" aria-label="Top half"><i data-lucide="panel-top"></i></button>
        <button id="workspace-bottom" class="icon-button" title="Bottom half" aria-label="Bottom half"><i data-lucide="panel-bottom"></i></button>
        <button id="workspace-full" class="icon-button" title="Maximize window" aria-label="Maximize window"><i data-lucide="expand"></i></button>
      </div>
      <hr />
      <div class="window-zoom" role="group" aria-label="Page zoom">
        <button id="window-zoom-out" class="icon-button" title="Zoom out" aria-label="Zoom out"><i data-lucide="zoom-out"></i></button>
        <button id="window-zoom-reset" title="Reset zoom" aria-label="Reset zoom">100%</button>
        <button id="window-zoom-in" class="icon-button" title="Zoom in" aria-label="Zoom in"><i data-lucide="zoom-in"></i></button>
      </div>
      <hr />
      <button id="window-reload" role="menuitem"><i data-lucide="rotate-cw"></i>Reload page</button>
      <button id="window-address" role="menuitem"><i data-lucide="globe"></i>Address bar</button>
      <button id="window-devtools" role="menuitem"><i data-lucide="code"></i>Developer tools</button>
      <hr />
      <button id="window-pin" role="menuitem"><i data-lucide="star"></i>Add to Favorites</button>
      <label class="menu-section-label" for="window-target">Move tab to window</label>
      <select id="window-target" aria-label="Move tab to window"></select>
      <button id="window-float" role="menuitem"><i data-lucide="panels-top-left"></i>Restore floating window</button>
      <button id="window-max" role="menuitem"><i data-lucide="maximize-2"></i>Maximize or restore</button>
      <button id="window-min" role="menuitem"><i data-lucide="minus"></i>Minimize</button>
      <button id="window-close" role="menuitem"><i data-lucide="x"></i>Close</button>
      <button id="tab-close" role="menuitem"><i data-lucide="x"></i>Close tab</button>
    </div>
  </main>
  <div id="browser-toolbar" class="browser-toolbar" hidden>
    <button id="back-button" class="icon-button" title="Back" aria-label="Back"><i data-lucide="arrow-left"></i></button>
    <button id="forward-button" class="icon-button" title="Forward" aria-label="Forward"><i data-lucide="arrow-right"></i></button>
    <button id="reload-button" class="icon-button" title="Reload" aria-label="Reload"><i data-lucide="rotate-cw"></i></button>
    <input id="address-input" type="url" aria-label="Page address" spellcheck="false" />
    <button id="add-favorite" class="icon-button" title="Add to Favorites" aria-label="Add to Favorites"><i data-lucide="star"></i></button>
    <span id="status-text">Ready</span>
    <button id="collapse-chrome" class="icon-button" title="Hide address bar" aria-label="Hide address bar"><i data-lucide="chevron-up"></i></button>
  </div>
  <dialog id="open-page-dialog">
    <form id="open-page-form">
      <div class="dialog-heading"><h2>Open page</h2><button id="close-page-dialog" class="icon-button" type="button" title="Close" aria-label="Close"><i data-lucide="x"></i></button></div>
      <label for="open-page-url">Address</label>
      <input id="open-page-url" type="text" placeholder="https:// or robot address" required autocomplete="off" />
      <p id="open-page-error" role="alert" hidden></p>
      <div class="dialog-actions"><button id="open-home" type="button">Console</button><button id="open-store" type="button">AppStore Admin</button><button class="primary" type="submit">Open</button></div>
    </form>
  </dialog>
  <script src="../node_modules/lucide/dist/umd/lucide.min.js"></script>
  <script src="./desktop-state.js"></script>
  <script src="../node_modules/dockview-core/dist/dockview-core.min.js"></script>
  <script src="./dock-layout.js"></script>
  <script src="./desktop.js"></script>
  <script src="./window-manager.js"></script>
  <script src="./shell.js"></script>
  <script src="./background-apps.js"></script>
  <script src="./appearance.js"></script>
</body>
</html>
