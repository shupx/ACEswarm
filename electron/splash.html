<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'self'; script-src 'self'">
  <title>Starting ACEswarm</title>
  <link rel="stylesheet" href="splash.css">
</head>
<body>
  <main>
    <div class="brand"><img src="assets/aivuda_icon_256.png" width="72" height="72" alt=""><span>ACEswarm</span></div>
    <h1 id="heading">Getting things ready.</h1>
    <p class="subtitle">Your robot workbench is starting up.</p>
    <div class="progress" role="progressbar" aria-label="Starting ACEswarm"><span></span></div>
    <p id="status" role="status">Preparing the runtime...</p>
    <pre id="error" role="alert" hidden></pre>
    <footer><span id="note">This may take a moment.</span><button id="quit" type="button">Quit</button></footer>
  </main>
  <script src="splash.js"></script>
</body>
</html>
