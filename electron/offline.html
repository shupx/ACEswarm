<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AivudaOS 未连接</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f4f6f8;
        color: #1f2933;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px;
      }

      main {
        width: min(680px, 100%);
        border: 1px solid #d8dee6;
        border-radius: 8px;
        background: #ffffff;
        padding: 32px;
        box-shadow: 0 18px 45px rgba(25, 35, 48, 0.12);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 24px;
        line-height: 1.25;
        letter-spacing: 0;
      }

      p {
        margin: 0 0 16px;
        color: #52606d;
        line-height: 1.6;
      }

      dl {
        display: grid;
        gap: 10px;
        margin: 24px 0;
      }

      dt {
        font-size: 13px;
        font-weight: 700;
        color: #334e68;
      }

      dd {
        margin: 0;
        overflow-wrap: anywhere;
      }

      code {
        display: block;
        padding: 10px 12px;
        border-radius: 6px;
        background: #edf2f7;
        color: #102a43;
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        font-size: 13px;
        line-height: 1.5;
      }

      button {
        min-height: 40px;
        border: 0;
        border-radius: 6px;
        padding: 0 16px;
        background: #1769aa;
        color: white;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:hover {
        background: #155f9a;
      }

      .secondary {
        color: #627d98;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>AivudaOS 页面暂时无法打开</h1>
      <p>请确认 AivudaOS/Caddy 已启动，并且目标地址可以从本机访问。</p>

      <dl>
        <div>
          <dt>目标地址</dt>
          <dd><code id="target-url">http://127.0.0.1:80</code></dd>
        </div>
        <div>
          <dt>加载错误</dt>
          <dd><code id="error-text">Unable to load target URL.</code></dd>
        </div>
      </dl>

      <button id="reload-button" type="button">重新加载</button>
      <p class="secondary">该 Electron 壳只负责打开已部署网页，不会自动启动 AivudaOS 服务。</p>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      document.getElementById("target-url").textContent = params.get("url") || "http://127.0.0.1:80";
      document.getElementById("error-text").textContent = params.get("error") || "Unable to load target URL.";

      document.getElementById("reload-button").addEventListener("click", () => {
        window.location.href = params.get("url") || "http://127.0.0.1:80";
      });
    </script>
  </body>
</html>
